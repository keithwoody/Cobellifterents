name: Cobellifterents
options:
  bundleIdPrefix: com.keithwoody
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  Cobellifterents:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Cobellifterents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithwoody.Cobellifterents
        PRODUCT_NAME: Cobellifterents
        INFOPLIST_FILE: Cobellifterents/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
        GENERATE_INFOPLIST_FILE: NO
  CobellifterentsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CobellifterentsTests
    dependencies:
      - target: Cobellifterents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keithwoody.CobellifterentsTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cobellifterents:
    build:
      targets:
        Cobellifterents: all
        CobellifterentsTests: [test]
    test:
      targets:
        - CobellifterentsTests
